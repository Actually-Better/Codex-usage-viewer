<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codex Usage Viewer</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f8fa;
        --panel: #ffffff;
        --text: #111827;
        --muted: #5b6472;
        --border: #d9dee7;
        --warning: #8a5a00;
        --warning-bg: #fff6d8;
        --ok: #0f766e;
        --bad: #b42318;
        --low: #ff6b72;
        --medium: #f59e0b;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111318;
          --panel: #181b22;
          --text: #f4f6fa;
          --muted: #aab2c0;
          --border: #2b303b;
          --warning: #ffd166;
          --warning-bg: #2b2413;
          --ok: #5eead4;
          --bad: #fca5a5;
          --low: #ff6b72;
          --medium: #fbbf24;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 360px;
        min-height: 480px;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .shell {
        padding: 12px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }

      h1 {
        margin: 0;
        font-size: 15px;
        line-height: 1.2;
      }

      button {
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        font: inherit;
        min-height: 30px;
        padding: 4px 9px;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .status {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        padding: 9px 10px;
        margin-bottom: 10px;
      }

      .status strong {
        display: block;
        font-size: 13px;
      }

      .status span {
        color: var(--muted);
        display: block;
        margin-top: 2px;
      }

      section {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        margin-bottom: 10px;
        overflow: hidden;
      }

      h2 {
        margin: 0;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0;
        color: var(--muted);
      }

      dl {
        margin: 0;
      }

      .row {
        display: grid;
        grid-template-columns: 118px 1fr;
        gap: 8px;
        padding: 8px 10px;
        border-top: 1px solid var(--border);
      }

      .row:first-child {
        border-top: 0;
      }

      dt {
        color: var(--muted);
      }

      dd {
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .badge {
        display: inline-block;
        border-radius: 999px;
        border: 1px solid var(--border);
        padding: 1px 7px;
        font-size: 12px;
      }

      .ok {
        color: var(--ok);
      }

      .bad {
        color: var(--bad);
      }

      .warn {
        color: var(--warning);
      }

      .note {
        background: var(--warning-bg);
        color: var(--warning);
        border-radius: 6px;
        padding: 7px 8px;
        margin: 8px 10px 10px;
      }

      .metric-list {
        display: grid;
        gap: 0;
      }

      .metric-card {
        padding: 10px;
        border-top: 1px solid var(--border);
      }

      .metric-card:first-child {
        border-top: 0;
      }

      .metric-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: start;
        gap: 10px;
      }

      .metric-title {
        color: var(--muted);
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      .metric-value {
        font-size: 18px;
        font-weight: 700;
        white-space: nowrap;
        text-align: right;
      }

      .progress {
        width: 100%;
        height: 8px;
        margin-top: 9px;
        border-radius: 999px;
        background: var(--border);
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        border-radius: inherit;
        background: #22c55e;
      }

      .progress-fill.medium {
        background: var(--medium);
      }

      .progress-fill.low {
        background: var(--low);
      }

      .metric-reset {
        color: var(--muted);
        font-size: 12px;
        margin-top: 7px;
        text-align: right;
      }

      .foot {
        color: var(--muted);
        font-size: 12px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <h1>Codex Usage Viewer</h1>
        <button id="refreshButton" type="button">Refresh</button>
      </header>

      <div class="status">
        <strong id="statusTitle">Loading local data...</strong>
        <span id="statusDetail">No external requests are used.</span>
      </div>

      <section>
        <h2>ChatGPT</h2>
        <dl id="chatgptSection"></dl>
      </section>

      <section>
        <h2>Codex / Credits</h2>
        <div id="codexSection" class="metric-list"></div>
      </section>

      <section>
        <h2>Diagnostics</h2>
        <dl id="diagnosticsSection"></dl>
        <div id="warningBox" class="note"></div>
      </section>

      <div class="foot">Local only. Not affiliated with OpenAI.</div>
    </div>

    <script src="usage-model.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
