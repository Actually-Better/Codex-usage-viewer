name: Notify PR activity

on:
  pull_request_target:
    types:
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - opened
      - edited
      - closed
      - reopened
      - synchronize
      - converted_to_draft
      - locked
      - unlocked
      - enqueued
      - dequeued
      - milestoned
      - demilestoned
      - ready_for_review
      - review_requested
      - review_request_removed
      - auto_merge_enabled
      - auto_merge_disabled
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: pr-notification-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  notify:
    name: Notify Ramiro
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub notification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request_target|pull_request_review|pull_request_review_comment)
              pr_number="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
              ;;

            issue_comment)
              if ! jq -e '.issue.pull_request != null' "$GITHUB_EVENT_PATH" >/dev/null; then
                exit 0
              fi

              if jq -e '(.comment.body // "") | contains("<!-- actually-better-pr-notification")' "$GITHUB_EVENT_PATH" >/dev/null; then
                exit 0
              fi

              pr_number="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")"
              ;;

            *)
              exit 0
              ;;
          esac

          marker="<!-- actually-better-pr-notification -->"
          since="$(date -u -d '10 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"

          duplicate_id="$(
            gh api \
              --paginate \
              "repos/$GH_REPO/issues/$pr_number/comments?per_page=100&since=$since" \
              --jq '.[] | select((.body // "") | startswith("<!-- actually-better-pr-notification")) | .id' \
              | tail -n 1
          )"

          if [[ -n "$duplicate_id" ]]; then
            exit 0
          fi

          body="$marker 🔔 @ramirogh, hay una actualización en el PR #$pr_number."

          gh api \
            --method POST \
            "repos/$GH_REPO/issues/$pr_number/comments" \
            -f body="$body"
