name: Notify PR status

on:
  pull_request_target:
    types: [closed]

permissions:
  pull-requests: write

jobs:
  notify:
    name: Notify Ramiro
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub notification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          CLOSED_BY: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$PR_MERGED" == "true" ]]; then
            status="fusionado"
            icon="✅"
          else
            status="cerrado sin fusionar"
            icon="⛔"
          fi

          body="$icon @ramirogh, el PR #$PR_NUMBER se ha $status por @$CLOSED_BY: [$PR_TITLE]($PR_URL)."

          gh api             --method POST             "repos/$GH_REPO/issues/$PR_NUMBER/comments"             -f body="$body"
